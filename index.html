<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIPARS – Masuk ke Sistem Informasi Pengarsipan</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>📁</text></svg>" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
        crossorigin="anonymous" />
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap"
        rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.0/dist/sweetalert2.all.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="style.css" />

    <!-- FOUC Prevention — mirrors admin.html theme settings -->
    <script>
        (function () {
            try {
                var raw = localStorage.getItem('setting_darkMode');
                var isDark = raw === null ? true
                    : (raw === 'false' || raw === '"false"' ? false : JSON.parse(raw));
                if (!isDark) {
                    document.documentElement.setAttribute('data-theme', 'light');
                }
            } catch (e) { }
        })();
    </script>

    <style>
        /* ── FOUC guard ── */
        html[data-theme="light"] body {
            background: linear-gradient(160deg, #f0f4ff 0%, #e8edf8 100%) !important;
            color: #1e293b !important;
        }

        /* ── Reset ── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        /* ── Body ── */
        body {
            font-family: 'Outfit', system-ui, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
            background: linear-gradient(160deg, #071028 0%, #0f1a35 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.25rem 1rem;
            transition: background 0.35s ease;
        }

        @media (max-height: 680px) {
            body {
                justify-content: flex-start;
                padding-top: 1rem;
            }
        }

        body.light-mode {
            background: linear-gradient(160deg, #f0f4ff 0%, #e8edf8 100%);
        }

        /* ── Headings ── */
        h1,
        h2,
        h3,
        h4 {
            font-family: 'Bricolage Grotesque', 'Outfit', system-ui, sans-serif;
        }

        [x-cloak] {
            display: none !important;
        }

        /* ── Floating Glow Orbs ── */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.14;
            pointer-events: none;
            animation: orb-float 12s ease-in-out infinite;
        }

        .orb-1 {
            width: 360px;
            height: 360px;
            background: #6366f1;
            top: -80px;
            left: -70px;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 280px;
            height: 280px;
            background: #38bdf8;
            bottom: -70px;
            right: -50px;
            animation-delay: -5s;
        }

        .orb-3 {
            width: 200px;
            height: 200px;
            background: #a78bfa;
            top: 45%;
            left: 50%;
            animation-delay: -8s;
        }

        body.light-mode .orb {
            opacity: 0.06;
        }

        @keyframes orb-float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-18px);
            }
        }

        .orb-3 {
            animation-name: orb-3-float;
        }

        @keyframes orb-3-float {

            0%,
            100% {
                transform: translateX(-50%) translateY(0);
            }

            50% {
                transform: translateX(-50%) translateY(-18px);
            }
        }

        @media (max-width: 479px) {
            .orb-1 {
                width: 200px;
                height: 200px;
            }

            .orb-2 {
                width: 160px;
                height: 160px;
            }

            .orb-3 {
                width: 130px;
                height: 130px;
            }
        }

        /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
           AUTH CARD
        ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
        .auth-card {
            width: 100%;
            max-width: 25.5rem;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 1.5rem;
            padding: 1.75rem 1.5rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
            animation: card-in 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
            position: relative;
            z-index: 10;
        }

        @media (min-width: 480px) {
            .auth-card {
                padding: 2rem;
                border-radius: 1.75rem;
                max-width: 26.5rem;
            }
        }

        @media (min-width: 640px) {
            .auth-card {
                padding: 2.25rem;
                border-radius: 2rem;
            }
        }

        body.light-mode .auth-card {
            background: rgba(255, 255, 255, 0.94);
            border-color: rgba(15, 23, 42, 0.10);
            box-shadow: 0 20px 60px rgba(15, 23, 42, 0.12);
        }

        @keyframes card-in {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
           INPUT SYSTEM
        ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
        .input-wrap,
        .input-wrap-both,
        .input-wrap-right {
            position: relative;
        }

        /* Left icon */
        .input-wrap>.i-left,
        .input-wrap-both>.i-left,
        .input-wrap-right>.i-left {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 2.625rem;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.38);
            z-index: 1;
            flex-shrink: 0;
        }

        body.light-mode .input-wrap>.i-left,
        body.light-mode .input-wrap-both>.i-left,
        body.light-mode .input-wrap-right>.i-left {
            color: #94a3b8;
        }

        /* Right button (eye toggle) */
        .input-wrap-both>.i-right {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.38);
            background: none;
            border: none;
            z-index: 1;
            transition: color 0.2s;
            flex-shrink: 0;
        }

        .input-wrap-both>.i-right:hover {
            color: rgba(255, 255, 255, 0.75);
        }

        body.light-mode .input-wrap-both>.i-right {
            color: #94a3b8;
        }

        body.light-mode .input-wrap-both>.i-right:hover {
            color: #475569;
        }

        /* Right chevron for select */
        .input-wrap-right>.i-right-icon {
            position: absolute;
            right: 0.875rem;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.35);
        }

        body.light-mode .input-wrap-right>.i-right-icon {
            color: #94a3b8;
        }

        /* Input field styling */
        .input-field {
            width: 100%;
            padding-top: 0.65rem;
            padding-bottom: 0.65rem;
            padding-left: 2.625rem !important;
            padding-right: 0.875rem !important;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 0.625rem;
            color: #f1f5f9;
            font-size: 0.875rem;
            font-family: 'Outfit', sans-serif;
            outline: none;
            line-height: 1.4;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }

        .input-wrap-both .input-field {
            padding-right: 2.5rem !important;
        }

        .input-wrap-right .input-field {
            padding-right: 2rem !important;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
        }

        .input-field::placeholder {
            color: rgba(255, 255, 255, 0.32);
            font-size: 0.85rem;
        }

        .input-field:focus {
            border-color: #6366f1;
            background: rgba(99, 102, 241, 0.08);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.20);
        }

        body.light-mode .input-field {
            background: #f8fafc;
            border-color: rgba(15, 23, 42, 0.16);
            color: #1e293b;
        }

        body.light-mode .input-field::placeholder {
            color: #94a3b8;
        }

        body.light-mode .input-field:focus {
            background: #ffffff;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
           FIELD LABEL
        ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
        .field-label {
            display: block;
            font-size: 0.69rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.48);
            margin-bottom: 0.3rem;
        }

        body.light-mode .field-label {
            color: #64748b;
        }

        /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
           TAB BAR
        ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
        .tab-bar {
            display: flex;
            background: rgba(255, 255, 255, 0.07);
            border-radius: 0.75rem;
            overflow: hidden;
            margin-bottom: 1.25rem;
            padding: 3px;
            gap: 3px;
        }

        body.light-mode .tab-bar {
            background: rgba(15, 23, 42, 0.07);
        }

        .tab-btn {
            flex: 1;
            padding: 0.55rem 0.5rem;
            font-weight: 600;
            font-size: 0.85rem;
            font-family: 'Outfit', sans-serif;
            color: rgba(255, 255, 255, 0.50);
            background: transparent;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            white-space: nowrap;
        }

        .tab-btn.active {
            background: #4f46e5;
            color: #fff;
            box-shadow: 0 2px 8px rgba(79, 70, 229, 0.35);
        }

        body.light-mode .tab-btn {
            color: #64748b;
        }

        body.light-mode .tab-btn.active {
            background: #4f46e5;
            color: #fff;
        }

        /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
           ROLE CARDS
        ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
        .role-card {
            padding: 0.625rem 0.75rem;
            border-radius: 0.75rem;
            border: 1px solid rgba(255, 255, 255, 0.10);
            background: rgba(255, 255, 255, 0.05);
            cursor: pointer;
            text-align: left;
            transition: background 0.18s, border-color 0.18s, box-shadow 0.18s, transform 0.12s;
            min-height: 4.25rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .role-card:hover {
            background: rgba(255, 255, 255, 0.10);
            transform: translateY(-1px);
        }

        .role-card.active {
            background: rgba(99, 102, 241, 0.22);
            border-color: #6366f1;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.30);
        }

        body.light-mode .role-card {
            background: rgba(241, 245, 249, .80);
            border-color: rgba(15, 23, 42, .10);
        }

        body.light-mode .role-card:hover {
            background: rgba(224, 231, 255, .80);
        }

        body.light-mode .role-card.active {
            background: rgba(224, 231, 255, .90);
            border-color: #6366f1;
        }

        body.light-mode .role-card .r-name {
            color: #334155 !important;
        }

        body.light-mode .role-card .r-desc {
            color: #64748b !important;
        }

        /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
           CREDENTIAL HINT (collapsible)
        ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
        .cred-toggle {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            padding: 0.55rem 0.875rem;
            background: rgba(99, 102, 241, 0.10);
            border: 1px solid rgba(99, 102, 241, 0.26);
            border-radius: 0.75rem;
            cursor: pointer;
            font-size: 0.73rem;
            font-weight: 600;
            font-family: 'Outfit', sans-serif;
            color: rgba(199, 210, 254, 0.90);
            transition: background 0.18s, border-radius 0.25s;
        }

        .cred-toggle:hover {
            background: rgba(99, 102, 241, 0.18);
        }

        .cred-toggle.open {
            border-radius: 0.75rem 0.75rem 0 0;
            border-bottom-color: transparent;
        }

        body.light-mode .cred-toggle {
            background: rgba(224, 231, 255, .70);
            border-color: rgba(99, 102, 241, .25);
            color: #3730a3;
        }

        body.light-mode .cred-toggle:hover {
            background: rgba(224, 231, 255, .90);
        }

        .cred-body {
            overflow: hidden;
            background: rgba(99, 102, 241, 0.07);
            border: 1px solid rgba(99, 102, 241, 0.20);
            border-top: none;
            border-radius: 0 0 0.75rem 0.75rem;
            font-size: 0.72rem;
            line-height: 1.65;
            color: rgba(199, 210, 254, 0.90);
            transition: max-height 0.28s ease, padding 0.28s ease;
        }

        .cred-body.open {
            max-height: 16rem;
            padding: 0.625rem 0.875rem 0.75rem;
        }

        .cred-body.closed {
            max-height: 0;
            padding: 0 0.875rem;
        }

        body.light-mode .cred-body {
            background: rgba(224, 231, 255, .55);
            border-color: rgba(99, 102, 241, .18);
            color: #3730a3;
        }

        body.light-mode .cred-body strong {
            color: #312e81;
        }

        .cred-body code {
            background: rgba(99, 102, 241, .15);
            color: #a5b4fc;
            padding: 0.08rem 0.28rem;
            border-radius: 0.25rem;
            font-size: 0.88em;
            font-family: 'Courier New', monospace;
        }

        body.light-mode .cred-body code {
            background: rgba(99, 102, 241, .12);
            color: #4338ca;
        }

        /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
           PRIMARY BUTTON
        ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
        .btn-primary {
            width: 100%;
            padding: 0.7rem 1rem;
            border-radius: 0.75rem;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #4f46e5, #0ea5e9);
            color: #fff;
            box-shadow: 0 4px 18px rgba(79, 70, 229, 0.38);
            transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
        }

        .btn-primary:hover:not(:disabled) {
            opacity: 0.92;
            transform: translateY(-1px);
            box-shadow: 0 6px 22px rgba(79, 70, 229, .50);
        }

        .btn-primary:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            opacity: 0.48;
            cursor: not-allowed;
        }

        /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
           THEME BUTTON
        ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
        .theme-btn {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 50;
            width: 2.375rem;
            height: 2.375rem;
            background: rgba(255, 255, 255, .10);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, .15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #fbbf24;
            font-size: 0.9rem;
            transition: background 0.2s, transform 0.2s;
        }

        .theme-btn:hover {
            background: rgba(255, 255, 255, .20);
            transform: scale(1.08);
        }

        body.light-mode .theme-btn {
            background: rgba(255, 255, 255, .85);
            border-color: rgba(15, 23, 42, .12);
            box-shadow: 0 2px 8px rgba(15, 23, 42, .10);
        }

        /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
           ANIMATIONS & ALERTS
        ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
        .section-fade {
            animation: sfade 0.22s ease both;
        }

        @keyframes sfade {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .error-box {
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
            padding: 0.65rem 0.875rem;
            border-radius: 0.65rem;
            background: rgba(239, 68, 68, .12);
            border: 1px solid rgba(239, 68, 68, .28);
            color: #fca5a5;
            font-size: 0.82rem;
            margin-bottom: 0.875rem;
            line-height: 1.4;
        }

        body.light-mode .error-box {
            background: rgba(254, 226, 226, .80);
            border-color: rgba(239, 68, 68, .25);
            color: #dc2626;
        }

        .sbar {
            height: 3px;
            border-radius: 2px;
            flex: 1;
            transition: background 0.3s;
        }

        @keyframes spin-i {
            to {
                transform: rotate(360deg);
            }
        }

        .spin {
            animation: spin-i 0.8s linear infinite;
            display: inline-block;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            20%,
            60% {
                transform: translateX(-7px);
            }

            40%,
            80% {
                transform: translateX(7px);
            }
        }

        .shake {
            animation: shake 0.4s ease;
        }

        /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
           LIGHT MODE OVERRIDES
        ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
        body.light-mode .text-white {
            color: #0f172a !important;
        }

        body.light-mode .text-white\/50 {
            color: #64748b !important;
        }

        body.light-mode .text-white\/40 {
            color: #94a3b8 !important;
        }

        body.light-mode .text-slate-500 {
            color: #64748b !important;
        }

        body.light-mode .text-slate-800 {

<body x-data="authApp()" x-init="init()" x-cloak :class="darkMode ? '' : 'light-mode'">

    <!-- Ambient background orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <!-- Theme toggle button -->
    <button class="theme-btn" @click="toggleTheme()" :title="darkMode ? 'Ganti ke Mode Terang' : 'Ganti ke Mode Gelap'">
        <i :class="darkMode ? 'fa-solid fa-sun' : 'fa-solid fa-moon'"></i>
    </button>

    <!-- ═══════════ AUTH CARD ═══════════ -->
    <div class="auth-card" id="authCard">

        <!-- Brand / Header -->
        <div class="text-center mb-5">
            <div
                class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-br from-indigo-500/20 to-sky-500/20 border border-white/10 shadow-lg shadow-indigo-500/20 mb-3 p-2">
                <img src="logo-removebg-preview (1).png" alt="Logo SIPARS Kominfo Deiyai"
                    class="w-full h-full object-contain drop-shadow" />
            </div>
            <h1 class="text-2xl sm:text-3xl font-extrabold tracking-wide"
                :class="darkMode ? 'text-white' : 'text-slate-800'">
                ARSIP KOMINFO
                <span class="block text-indigo-400 text-xl tracking-widest font-mono font-bold mt-0.5">DEIYAI</span>
            </h1>
            <p class="text-xs mt-1 leading-relaxed" :class="darkMode ? 'text-white/50' : 'text-slate-500'">
                Sistem Informasi Pengarsipan<br>Dinas Kominfo Kabupaten Deiyai
            </p>
        </div>

        <!-- Active Session Banner (if user already logged in) -->
        <div x-show="existingSession" x-transition
            class="mb-4 p-3 rounded-xl bg-indigo-500/15 border border-indigo-500/30 flex items-center justify-between text-xs">
            <div class="flex items-center gap-2 truncate pr-2">
                <span class="text-base flex-shrink-0" x-text="roleEmojis[existingSession?.role] || '👤'"></span>
                <div class="leading-tight truncate">
                    <p class="font-semibold" :class="darkMode ? 'text-white' : 'text-slate-800'">
                        Sesi Aktif: <span x-text="existingSession?.name || existingSession?.role"></span>
                    </p>
                    <p class="text-[11px]" :class="darkMode ? 'text-indigo-300' : 'text-indigo-600'"
                        x-text="existingSession?.role"></p>
                </div>
            </div>
            <a href="admin.html"
                class="px-2.5 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-lg shadow transition flex items-center gap-1.5 flex-shrink-0">
                <span>Dashboard</span>
                <i class="fa-solid fa-arrow-right text-[10px]"></i>
            </a>
        </div>

        <!-- Tabs -->
        <div class="tab-bar">
            <button class="tab-btn" :class="tab==='login'?'active':''" @click="tab='login'">
                <i class="fa-solid fa-right-to-bracket mr-1"></i>Masuk
            </button>
            <button class="tab-btn" :class="tab==='register'?'active':''" @click="tab='register'">
                <i class="fa-solid fa-user-plus mr-1"></i>Daftar
            </button>
        </div>

        <!-- ═══════ LOGIN TAB ═══════ -->
        <div x-show="tab==='login'" x-cloak class="section-fade">

            <!-- Collapsible credential hint with Quick-Fill -->
            <div class="mb-4">
                <button type="button" class="cred-toggle" :class="showCreds?'open':''" @click="showCreds=!showCreds">
                    <span class="flex items-center gap-1.5">
                        <i class="fa-solid fa-circle-info text-xs"></i>
                        <span>Akun Default (Klik untuk Mengisi)</span>
                    </span>
                    <i class="fa-solid text-xs transition-transform duration-200"
                        :class="showCreds ? 'fa-chevron-up rotate-0' : 'fa-chevron-down'"></i>
                </button>
                <div class="cred-body" :class="showCreds?'open':'closed'">
                    <div class="space-y-1.5 py-1">
                        <template x-for="u in defaultUsers.slice(0, 4)" :key="u.role">
                            <div @click="quickFill(u)"
                                class="flex items-center justify-between p-1.5 rounded-md hover:bg-indigo-500/20 active:scale-[0.99] cursor-pointer transition group"
                                :title="'Klik untuk otomatis mengisi sebagai ' + u.role">
                                <div class="flex items-center gap-1.5 truncate">
                                    <span x-text="roleEmojis[u.role] || '👤'"></span>
                                    <strong class="font-medium" x-text="u.role + ':'"></strong>
                                    <span class="opacity-80 text-[11px] truncate" x-text="u.email"></span>
                                </div>
                                <div class="flex items-center gap-1.5 flex-shrink-0">
                                    <code x-text="u.password"></code>
                                    <i
                                        class="fa-solid fa-arrow-turn-down text-[10px] text-indigo-400 opacity-60 group-hover:opacity-100 transition"></i>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>

            <!-- Role Selection Cards -->
            <div class="mb-4">
                <label class="field-label">Pilih Role</label>
                <div class="grid grid-cols-2 gap-2">
                    <template x-for="r in roles" :key="r.role">
                        <button type="button" class="role-card" :class="login.role===r.role?'active':''"
                            @click="selectRole(r.role)">
                            <div class="text-base mb-0.5 leading-none" x-text="r.emoji"></div>
                            <div class="text-xs font-semibold r-name leading-tight"
                                :class="darkMode?'text-white':'text-slate-700'" x-text="r.label"></div>
                            <div class="text-xs mt-0.5 r-desc leading-tight"
                                :class="darkMode?'text-white/40':'text-slate-400'" x-text="r.desc"></div>
                        </button>
                    </template>
                </div>
            </div>

            <!-- Email -->
            <div class="mb-3">
                <label class="field-label">Email</label>
                <div class="input-wrap">
                    <span class="i-left"><i class="fa-solid fa-envelope"></i></span>
                    <input x-model="login.email" type="email" placeholder="email@kominfo.go.id" autocomplete="email"
                        class="input-field" @keydown.enter="submitLogin()" @input="login.error=''" />
                </div>
            </div>

            <!-- Password -->
            <div class="mb-4">
                <label class="field-label">Password</label>
                <div class="input-wrap-both">
                    <span class="i-left"><i class="fa-solid fa-lock"></i></span>
                    <input x-model="login.pass" :type="login.showPass?'text':'password'" placeholder="Masukkan password"
                        autocomplete="current-password" class="input-field" @keydown.enter="submitLogin()"
                        @input="login.error=''" />
                    <button type="button" class="i-right" @click="login.showPass=!login.showPass"
                        :title="login.showPass?'Sembunyikan':'Tampilkan'">
                        <i :class="login.showPass?'fa-solid fa-eye-slash':'fa-solid fa-eye'"></i>
                    </button>
                </div>
            </div>

            <!-- Inline Error -->
            <div x-show="login.error" x-transition class="error-box">
                <i class="fa-solid fa-triangle-exclamation flex-shrink-0 mt-0.5 text-xs"></i>
                <span x-text="login.error"></span>
            </div>

            <!-- Submit Button -->
            <button class="btn-primary" @click="submitLogin()" :disabled="loading">
                <template x-if="loading">
                    <span><i class="fa-solid fa-circle-notch spin mr-2"></i>Memverifikasi...</span>
                </template>
                <template x-if="!loading">
                    <span><i class="fa-solid fa-right-to-bracket mr-2"></i>Masuk ke SIPARS</span>
                </template>
            </button>

            <!-- Links -->
            <div class="flex justify-between mt-3 text-xs" :class="darkMode?'text-indigo-400':'text-indigo-600'">
                <a href="#" @click.prevent="showForgotPassword()" class="hover:underline underline-offset-2">
                    <i class="fa-solid fa-key mr-1"></i>Lupa password?
                </a>
                <a href="#" @click.prevent="tab='register'" class="hover:underline underline-offset-2">
                    Belum punya akun? →
                </a>
            </div>
        </div>

        <!-- ═══════ REGISTER TAB ═══════ -->
        <div x-show="tab==='register'" x-cloak class="section-fade space-y-3">

            <!-- Nama Lengkap -->
            <div>
                <label class="field-label">Nama Lengkap</label>
                <div class="input-wrap">
                    <span class="i-left"><i class="fa-solid fa-user"></i></span>
                    <input x-model="reg.name" type="text" placeholder="Nama lengkap Anda" autocomplete="name"
                        class="input-field" />
                </div>
            </div>

            <!-- Email -->
            <div>
                <label class="field-label">Email</label>
                <div class="input-wrap">
                    <span class="i-left"><i class="fa-solid fa-envelope"></i></span>
                    <input x-model="reg.email" type="email" placeholder="email@domain.go.id" autocomplete="email"
                        class="input-field" />
                </div>
            </div>

            <!-- Role + Password (2 cols on sm+) -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="field-label">Role</label>
                    <div class="input-wrap-right">
                        <span class="i-left"><i class="fa-solid fa-shield-halved"></i></span>
                        <select x-model="reg.role" class="input-field">
                            <option class="text-black bg-white" value="Operator Kominfo">⚙️ Operator</option>
                            <option class="text-black bg-white" value="User Unit">👤 User Unit</option>
                            <option class="text-black bg-white" value="Viewer">👁️ Viewer</option>
                        </select>
                        <span class="i-right-icon"><i class="fa-solid fa-chevron-down"></i></span>
                    </div>
                </div>
                <div>
                    <label class="field-label">Password</label>
                    <div class="input-wrap-both">
                        <span class="i-left"><i class="fa-solid fa-lock"></i></span>
                        <input x-model="reg.pass" :type="reg.showPass?'text':'password'" placeholder="Min 8 karakter"
                            autocomplete="new-password" class="input-field" @input="checkPasswordStrength(reg.pass)" />
                        <button type="button" class="i-right" @click="reg.showPass=!reg.showPass">
                            <i :class="reg.showPass?'fa-solid fa-eye-slash':'fa-solid fa-eye'"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Password Strength Bar -->
            <div x-show="reg.pass.length > 0" class="!mt-1">
                <div class="flex gap-1 mb-1">
                    <template x-for="i in 4" :key="i">
                        <div class="sbar" :class="strengthBarClass(i)"></div>
                    </template>
                </div>
                <p class="text-xs" x-text="passwordStrength.label" :class="strengthLabelClass()"></p>
            </div>

            <!-- Konfirmasi Password -->
            <div>
                <label class="field-label">Konfirmasi Password</label>
                <div class="input-wrap-both">
                    <span class="i-left"><i class="fa-solid fa-lock-open"></i></span>
                    <input x-model="reg.pass2" :type="reg.showPass2?'text':'password'" placeholder="Ulangi password"
                        autocomplete="new-password" class="input-field" :class="pass2Class()" />
                    <button type="button" class="i-right" @click="reg.showPass2=!reg.showPass2">
                        <i :class="reg.showPass2?'fa-solid fa-eye-slash':'fa-solid fa-eye'"></i>
                    </button>
                </div>
                <div class="min-h-[1.1rem] mt-1">
                    <p x-show="pass2Mismatch()" class="text-xs text-red-400">
                        <i class="fa-solid fa-xmark mr-1"></i>Password tidak cocok
                    </p>
                    <p x-show="pass2Match()" class="text-xs text-emerald-400">
                        <i class="fa-solid fa-check mr-1"></i>Password cocok
                    </p>
                </div>
            </div>

            <!-- Submit Register -->
            <button class="btn-primary !mt-1" @click="submitRegister()" :disabled="loading">
                <template x-if="loading">
                    <span><i class="fa-solid fa-circle-notch spin mr-2"></i>Mendaftarkan...</span>
                </template>
                <template x-if="!loading">
                    <span><i class="fa-solid fa-user-plus mr-2"></i>Buat Akun</span>
                </template>
            </button>

            <p class="text-center text-xs" :class="darkMode?'text-white/50':'text-slate-500'">
                Sudah punya akun?
                <a href="#" @click.prevent="tab='login'" class="font-semibold underline underline-offset-2"
                    :class="darkMode?'text-indigo-400':'text-indigo-600'">Masuk</a>
            </p>
        </div>

    </div><!-- /authCard -->

    <script>
        function authApp() {
            return {
                tab: 'login',
                darkMode: true,
                loading: false,
                showCreds: false,
                existingSession: null,

                roles: [
                    { role: 'Admin Utama', label: 'Admin Utama', emoji: '👑', desc: 'Akses penuh' },
                    { role: 'Operator Kominfo', label: 'Operator', emoji: '⚙', desc: 'Kelola dokumen' },
                    { role: 'User Unit', label: 'User Unit', emoji: '👤', desc: 'Lihat & pinjam' },
                    { role: 'Viewer', label: 'Viewer', emoji: '👁', desc: 'Baca saja' },
                ],

                roleEmojis: {
                    'Admin Utama': '👑',
                    'Operator Kominfo': '⚙',
                    'User Unit': '👤',
                    'Viewer': '👁'
                },

                defaultUsers: [
                    { email: 'admin@kominfo.go.id', password: 'Admin@123', role: 'Admin Utama', name: 'Administrator' },
                    { email: 'operator@kominfo.go.id', password: 'Operator@123', role: 'Operator Kominfo', name: 'Operator Kominfo' },
                    { email: 'user@deiyai.go.id', password: 'User@123', role: 'User Unit', name: 'User Unit' },
                    { email: 'viewer@deiyai.go.id', password: 'Viewer@123', role: 'Viewer', name: 'Viewer' },
                ],

                login: {
                    role: 'Admin Utama',
                    email: 'admin@kominfo.go.id',
                    pass: 'Admin@123',
                    showPass: false,
                    error: ''
                },

                reg: {
                    name: '',
                    email: '',
                    pass: '',
                    pass2: '',
                    role: 'Operator Kominfo',
                    showPass: false,
                    showPass2: false
                },

                passwordStrength: { score: 0, label: '' },

                init() {
                    // Theme initialization matching admin.html & arsip.js
                    const raw = localStorage.getItem('setting_darkMode');
                    if (raw !== null) {
                        try {
                            this.darkMode = JSON.parse(raw);
                        } catch (e) {
                            this.darkMode = raw !== 'false';
                        }
                    }

                    if (!this.darkMode) {
                        document.documentElement.setAttribute('data-theme', 'light');
                        document.body.classList.add('light-mode');
                    } else {
                        document.documentElement.removeAttribute('data-theme');
                        document.body.classList.remove('light-mode');
                    }

                    // Check existing session
                    const savedRole = localStorage.getItem('userRole');
                    const savedProfile = localStorage.getItem('userProfile');
                    if (savedRole && savedProfile) {
                        try {
                            this.existingSession = { role: savedRole, ...JSON.parse(savedProfile) };
                        } catch (e) {
                            this.existingSession = { role: savedRole };
                        }
                    }

                    // Show creds open on desktop, closed on mobile
                    this.showCreds = window.innerWidth >= 640;

                    // Load persisted registered users
                    const saved = localStorage.getItem('registeredUsers');
                    if (saved) {
                        try {
                            JSON.parse(saved).forEach(u => {
                                if (!this.defaultUsers.find(d => d.email.toLowerCase() === u.email.toLowerCase())) {
                                    this.defaultUsers.push(u);
                                }
                            });
                        } catch (e) { }
                    }
                },

                toggleTheme() {
                    this.darkMode = !this.darkMode;
                    if (this.darkMode) {
                        document.documentElement.removeAttribute('data-theme');
                        document.body.classList.remove('light-mode');
                    } else {
                        document.documentElement.setAttribute('data-theme', 'light');
                        document.body.classList.add('light-mode');
                    }
                    localStorage.setItem('setting_darkMode', JSON.stringify(this.darkMode));
                },

                selectRole(role) {
                    this.login.role = role;
                    this.login.error = '';
                    const u = this.defaultUsers.find(u => u.role === role);
                    if (u) {
                        this.login.email = u.email;
                        this.login.pass = u.password;
                    }
                },

                quickFill(user) {
                    this.login.role = user.role;
                    this.login.email = user.email;
                    this.login.pass = user.password;
                    this.login.error = '';
                },

                submitLogin() {
                    this.login.error = '';
                    if (!this.login.email.trim() || !this.login.pass.trim()) {
                        this.login.error = 'Email dan password harus diisi.';
                        return;
                    }
                    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(this.login.email)) {
                        this.login.error = 'Format email tidak valid.';
                        return;
                    }
                    this.loading = true;
                    setTimeout(() => {
                        const em = this.login.email.trim().toLowerCase();
                        const matched = this.defaultUsers.find(u =>
                            u.email.toLowerCase() === em &&
                            u.password === this.login.pass &&
                            u.role === this.login.role
                        );
                        this.loading = false;

                        if (!matched) {
                            const byEmail = this.defaultUsers.find(u => u.email.toLowerCase() === em);
                            if (!byEmail) {
                                this.login.error = 'Email tidak terdaftar di sistem.';
                            } else {
                                const byRole = this.defaultUsers.find(u => u.email.toLowerCase() === em && u.role === this.login.role);
                                this.login.error = !byRole ? `Email ini bukan role "${this.login.role}".` : 'Password salah. Coba lagi.';
                            }
                            const card = document.getElementById('authCard');
                            if (card) {
                                card.classList.add('shake');
                                setTimeout(() => card.classList.remove('shake'), 450);
                            }
                            return;
                        }

                        // Store session
                        localStorage.setItem('userRole', matched.role);
                        localStorage.setItem('userProfile', JSON.stringify({
                            name: matched.name,
                            email: matched.email,
                            role: matched.role,
                            status: 'Aktif',
                            phone: '',
                            joinDate: new Date().toLocaleDateString('id-ID'),
                            lastLogin: new Date().toLocaleString('id-ID')
                        }));

                        const desc = {
                            'Admin Utama': 'Akses penuh ke semua fitur arsip',
                            'Operator Kominfo': 'Mengelola dan verifikasi dokumen',
                            'User Unit': 'Akses melihat dan meminjam dokumen',
                            'Viewer': 'Akses baca saja'
                        };

                        Swal.fire({
                            icon: 'success',
                            title: `Selamat datang, ${matched.name}! 👋`,
                            html: `<span style="color:#6366f1;font-weight:600">${matched.role}</span><br><small style="color:#94a3b8">${desc[matched.role] || ''}</small>`,
                            timer: 1600,
                            showConfirmButton: false,
                            background: this.darkMode ? '#0f1a35' : '#ffffff',
                            color: this.darkMode ? '#f1f5f9' : '#1e293b',
                        }).then(() => {
                            window.location.href = 'admin.html';
                        });
                    }, 450);
                },

                submitRegister() {
                    const swal = (icon, title, text) => Swal.fire({
                        icon,
                        title,
                        text,
                        confirmButtonColor: '#6366f1',
                        background: this.darkMode ? '#0f1a35' : '#fff',
                        color: this.darkMode ? '#f1f5f9' : '#1e293b'
                    });

                    if (!this.reg.name.trim() || !this.reg.email.trim() || !this.reg.pass || !this.reg.pass2) {
                        return swal('warning', 'Data Tidak Lengkap', 'Semua field harus diisi!');
                    }
                    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(this.reg.email)) {
                        return swal('error', 'Email Tidak Valid', 'Format email salah.');
                    }
                    if (this.defaultUsers.find(u => u.email.toLowerCase() === this.reg.email.toLowerCase())) {
                        return swal('error', 'Email Sudah Terdaftar', 'Email sudah digunakan. Silakan login.');
                    }
                    if (this.reg.pass.length < 8) {
                        return swal('warning', 'Password Terlalu Pendek', 'Minimal 8 karakter.');
                    }
                    if (!/(?=.*[a-zA-Z])(?=.*\d)/.test(this.reg.pass)) {
                        return swal('warning', 'Password Lemah', 'Harus mengandung huruf dan angka.');
                    }
                    if (this.reg.pass !== this.reg.pass2) {
                        return swal('error', 'Password Tidak Cocok', 'Konfirmasi tidak sesuai.');
                    }

                    this.loading = true;
                    setTimeout(() => {
                        const newUser = {
                            email: this.reg.email.trim().toLowerCase(),
                            password: this.reg.pass,
                            role: this.reg.role,
                            name: this.reg.name.trim()
                        };

                        // Persist to registeredUsers for login check
                        try {
                            const ex = localStorage.getItem('registeredUsers');
                            const l = ex ? JSON.parse(ex) : [];
                            l.push(newUser);
                            localStorage.setItem('registeredUsers', JSON.stringify(l));
                        } catch (e) { }

                        // Also synchronize with siparsUsers for admin.html user management table
                        try {
                            const exAdmin = localStorage.getItem('siparsUsers');
                            const adminList = exAdmin ? JSON.parse(exAdmin) : [];
                            const newId = (adminList.length > 0 ? Math.max(...adminList.map(u => u.id || 0)) : 6) + 1;
                            adminList.push({
                                id: newId,
                                name: newUser.name,
                                email: newUser.email,
                                role: newUser.role,
                                status: 'Aktif',
                                joinDate: new Date().toISOString().split('T')[0]
                            });
                            localStorage.setItem('siparsUsers', JSON.stringify(adminList));
                        } catch (e) { }

                        this.defaultUsers.push(newUser);
                        localStorage.setItem('userRole', newUser.role);
                        localStorage.setItem('userProfile', JSON.stringify({
                            name: newUser.name,
                            email: newUser.email,
                            role: newUser.role,
                            status: 'Aktif',
                            phone: '',
                            joinDate: new Date().toLocaleDateString('id-ID'),
                            lastLogin: new Date().toLocaleString('id-ID')
                        }));

                        this.loading = false;
                        Swal.fire({
                            icon: 'success',
                            title: 'Akun Berhasil Dibuat! 🎉',
                            html: `Selamat datang, <strong>${newUser.name}</strong>!<br><small style="color:#94a3b8">Role: ${newUser.role}</small>`,
                            timer: 1600,
                            showConfirmButton: false,
                            background: this.darkMode ? '#0f1a35' : '#ffffff',
                            color: this.darkMode ? '#f1f5f9' : '#1e293b',
                        }).then(() => {
                            window.location.href = 'admin.html';
                        });
                    }, 500);
                },

                checkPasswordStrength(p) {
                    let s = 0;
                    if (p.length >= 8) s++;
                    if (/[A-Z]/.test(p)) s++;
                    if (/[0-9]/.test(p)) s++;
                    if (/[^a-zA-Z0-9]/.test(p)) s++;
                    this.passwordStrength = {
                        score: s,
                        label: ['', 'Lemah', 'Cukup', 'Kuat', 'Sangat Kuat'][s] || 'Lemah'
                    };
                },

                strengthBarClass(i) {
                    const s = this.passwordStrength.score;
                    if (i > s) return this.darkMode ? 'bg-white/10' : 'bg-slate-200';
                    if (s <= 1) return 'bg-red-500';
                    if (s === 2) return 'bg-amber-400';
                    if (s === 3) return 'bg-yellow-300';
                    return 'bg-emerald-400';
                },

                strengthLabelClass() {
                    const s = this.passwordStrength.score;
                    if (s <= 1) return 'text-red-400';
                    if (s === 2) return 'text-amber-400';
                    return 'text-emerald-400';
                },

                pass2Class() {
                    if (!this.reg.pass2) return '';
                    if (this.reg.pass !== this.reg.pass2) return '!border-red-500/70 !bg-red-500/5';
                    return '!border-emerald-500/70 !bg-emerald-500/5';
                },

                pass2Mismatch() {
                    return this.reg.pass2.length > 0 && this.reg.pass !== this.reg.pass2;
                },

                pass2Match() {
                    return this.reg.pass2.length > 0 && this.reg.pass === this.reg.pass2;
                },

                showForgotPassword() {
                    Swal.fire({
                        icon: 'info',
                        title: 'Lupa Password?',
                        html: `Hubungi administrator untuk reset password akun Anda.<br><br><strong>Kontak Layanan:</strong><br>📧 admin@kominfo.deiyai.go.id<br>📞 (0981) xxx-xxxx`,
                        confirmButtonText: 'Mengerti',
                        confirmButtonColor: '#6366f1',
                        background: this.darkMode ? '#0f1a35' : '#ffffff',
                        color: this.darkMode ? '#f1f5f9' : '#1e293b',
                    });
                }
            };
        }
    </script>
</body>

</html>
